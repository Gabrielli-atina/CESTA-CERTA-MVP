<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cesta Certa</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><h1>Cesta Certa</h1>
{% if session.uid %}<form method="post" action="{{ url_for('main.logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="sec" style="width:auto;margin:0">Sair</button></form>{% endif %}</header>
<main>
{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}" role="alert">{{ m }}</div>{% endfor %}
{% block conteudo %}{% endblock %}
{% if session.uid %}<a class="btn sec" href="{{ url_for('main.home') }}">Início</a>{% endif %}
</main></body></html>
