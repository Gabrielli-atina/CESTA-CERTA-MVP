{% extends "base.html" %}{% block conteudo %}<h2>Cadastrar família</h2>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label for="nome">Nome do responsável</label><input id="nome" name="nome" maxlength="120" required>
<label for="contato">Contato</label><input id="contato" name="contato" maxlength="30" inputmode="tel" required>
<label for="pessoas">Número de pessoas</label><input id="pessoas" name="pessoas" type="number" min="1" required>
<button>Salvar</button></form>{% endblock %}
